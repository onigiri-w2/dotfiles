# --- 基本オプション ----------------------------------------------------------
# サーバ/セッションの挙動設定。キーバインドは keybindings.conf、見た目は
# statusline.conf に分離。

# ESC 遅延をなくす（nvim の ESC がキビキビ動く。デフォルトは 500ms）
set -sg escape-time 10

# window/pane 番号を 1 始まりに + 閉じたら番号を詰め直す
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 拡張キーシーケンスを有効化（Shift+Enter等をアプリに正しく渡す）
# always にすると mode 1 を強制し、paste 内の改行(Ctrl-J)まで拡張キー列に
# エンコードされて nvim 等で `j` に化ける。on ならアプリが要求したときだけ
# 拡張キーを使うので Shift+Enter は動きつつ paste は壊れない。
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# マウス操作の有効化
set -g mouse on

# claude CLI はプロセスタイトルを自身のバージョン番号（例: 2.1.208）に書き換える
# ため、automatic-rename がそれを window 名にしてしまう。バージョン番号っぽい
# コマンド名は "claude" と表示する。
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'
