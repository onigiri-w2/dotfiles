# エントリポイント。実体は関心事別の分割ファイル側にある。
# 読み込み順が意味を持つ: options → keybindings → statusline → plugins → local。
# plugins (TPM の run) は全オプションの後、local は共有設定の上書き用に末尾。
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keybindings.conf
source-file ~/.config/tmux/statusline.conf
source-file ~/.config/tmux/plugins.conf

# このマシン固有の設定（git 管理外、無ければ無視）。
source-file -q ~/.config/tmux/local.conf
