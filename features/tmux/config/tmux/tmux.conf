unbind C-b
set -g prefix C-a

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Vimスタイルのペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# アクティブなペインをズーム（他のペインを非表示に）
bind z resize-pane -Z

# ステータスバーの基本設定（透過背景）
set -g status-style bg=default,fg=white
set -g status-interval 1
set -g status-position bottom

# 左側のステータス - セッション名をシンプルに表示
set -g status-left "#[fg=green][#S]#[default] "
set -g status-left-length 20

# 右側のステータス - PREFIX状態とZOOM状態を明確に表示
set -g status-right "#{?client_prefix,#[reverse]#[bold]#[fg=red] PREFIX #[default],}#{?window_zoomed_flag,#[reverse]#[bold]#[fg=blue] ZOOM #[default],}"
set -g status-right-length 40

# ウィンドウステータスの設定
set -g window-status-current-style fg=white,bold,bg=default
set -g window-status-current-format "#[fg=brightblue](#[fg=white]#I:#W#[fg=brightblue])#[default]"
set -g window-status-format "#I:#W"


# 拡張キーシーケンスを有効化（Shift+Enter等をアプリに正しく渡す）
# always にすると mode 1 を強制し、paste 内の改行(Ctrl-J)まで拡張キー列に
# エンコードされて nvim 等で `j` に化ける。on ならアプリが要求したときだけ
# 拡張キーを使うので Shift+Enter は動きつつ paste は壊れない。
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# マウス操作の有効化
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# このマシン固有の設定（git 管理外、無ければ無視）。
# 末尾で読むことで上の共有設定を上書きできる。
source-file -q ~/.config/tmux/local.conf
