unbind C-b
set -g prefix C-a

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Vimスタイルのペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# アクティブなペインをズーム（他のペインを非表示に）
bind z resize-pane -Z

# --- QOL 設定 ---------------------------------------------------------------
# ESC 遅延をなくす（nvim の ESC がキビキビ動く。デフォルトは 500ms）
set -sg escape-time 10

# 直感的な分割。分割/新規窓は今いるディレクトリを引き継ぐ
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# 設定リロードを prefix + r に
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# window/pane 番号を 1 始まりに + 閉じたら番号を詰め直す
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- ポップアップ (display-popup) -------------------------------------------
# prefix + g で lazygit を全面ポップアップ。今の pane のディレクトリで開くので、
# 作業を中断せず git 操作 → 閉じれば元の pane に戻る（-E で終了時に閉じる）。
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# prefix + D で lazydocker を全面ポップアップ。Docker Desktop を開かずに
# コンテナ/イメージの状態確認・ログ閲覧・停止操作ができる（小文字 d は
# detach の既定のまま残す）。
bind D display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazydocker"

# prefix + o で使い捨ての scratch シェルをポップアップ（同名セッションを再利用）。
# ちょい調べ物・別ディレクトリでのコマンド用。※ o の既定(次のペインへ移動)を上書き。
bind o display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"

# prefix + s で fzf ポップアップからセッション切替。ctrl-x で選択中のを kill。
bind s display-popup -E -w 40% -h 50% "~/.config/tmux/session-switcher.sh"
# 標準のツリー表示は prefix + S に退避（一覧俯瞰・セッション削除 x 等に便利）。
bind S choose-tree -Zs

# ステータスバーの基本設定（透過背景）
set -g status-style bg=default,fg=white
set -g status-interval 1
set -g status-position bottom

# 左側のステータス - セッション名をシンプルに表示
set -g status-left "#[fg=green][#S]#[default] "
set -g status-left-length 20

# 右側のステータス - PREFIX状態とZOOM状態を明確に表示
set -g status-right "#{?client_prefix,#[reverse]#[bold]#[fg=red] PREFIX #[default],}#{?window_zoomed_flag,#[reverse]#[bold]#[fg=blue] ZOOM #[default],}"
set -g status-right-length 40

# ウィンドウステータスの設定
set -g window-status-current-style fg=white,bold,bg=default
set -g window-status-current-format "#[fg=brightblue](#[fg=white]#I:#W#[fg=brightblue])#[default]"
set -g window-status-format "#I:#W"


# 拡張キーシーケンスを有効化（Shift+Enter等をアプリに正しく渡す）
# always にすると mode 1 を強制し、paste 内の改行(Ctrl-J)まで拡張キー列に
# エンコードされて nvim 等で `j` に化ける。on ならアプリが要求したときだけ
# 拡張キーを使うので Shift+Enter は動きつつ paste は壊れない。
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# マウス操作の有効化
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# --- コピーモード（vi 操作 + macOS クリップボード連携）----------------------
setw -g mode-keys vi
# v で選択開始、y で選択を pbcopy に流す（コピー後もコピーモードに留まる）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe "pbcopy"
# マウスでドラッグ選択した場合も、離した時点で pbcopy に入れる
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# このマシン固有の設定（git 管理外、無ければ無視）。
# 末尾で読むことで上の共有設定を上書きできる。
source-file -q ~/.config/tmux/local.conf
