# --- プラグイン (TPM) -------------------------------------------------------
# TPM 本体は install.zsh が ~/.tmux/plugins/tpm へ clone 済み。
# 初回のみ tmux 起動後に prefix + I で各プラグインを取得する。
#
# 重要: ~/.config/tmux は dotfiles への symlink。TPM は放置すると XDG を見て
# ~/.config/tmux/plugins（＝リポジトリ内）へ clone してしまうので、置き場を
# リポジトリ外の ~/.tmux/plugins に固定する（$HOME を shell 展開して絶対パス化）。
run 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"'
set -g @plugin 'tmux-plugins/tpm'

# TPM 起動（この run は全 @plugin/オプションより後・末尾に置くのが作法）。
run '~/.tmux/plugins/tpm/tpm'
