# --- キーバインド ------------------------------------------------------------

# prefix を C-a に
unbind C-b
set -g prefix C-a

# ペインリサイズ（-r で連打可）
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Vimスタイルのペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# アクティブなペインをズーム（他のペインを非表示に）
bind z resize-pane -Z

# 直感的な分割。分割/新規窓は今いるディレクトリを引き継ぐ
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# --- ウィンドウ移動（prefix なしの1ストローク） ------------------------------
# WezTerm 側で Option を Alt (Esc+) として送る設定済みが前提
# (send_composed_key_when_*_alt_is_pressed = false)。
# Alt+h/l で隣のウィンドウへ（zsh の M-l 小文字化等を潰すが実用上支障なし）
bind -n M-h previous-window
bind -n M-l next-window
# C-a C-a で直前のウィンドウとトグル（literal C-a の送信は元々未バインドで
# 不可だったので、失うものはない）
bind C-a last-window

# 設定リロードを prefix + r に
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- ポップアップ (display-popup) -------------------------------------------
# prefix + g で lazygit を全面ポップアップ。今の pane のディレクトリで開くので、
# 作業を中断せず git 操作 → 閉じれば元の pane に戻る（-E で終了時に閉じる）。
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# prefix + D で lazydocker を全面ポップアップ。Docker Desktop を開かずに
# コンテナ/イメージの状態確認・ログ閲覧・停止操作ができる（小文字 d は
# detach の既定のまま残す）。
bind D display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazydocker"

# prefix + o で使い捨ての scratch シェルをポップアップ（同名セッションを再利用）。
# ちょい調べ物・別ディレクトリでのコマンド用。※ o の既定(次のペインへ移動)を上書き。
bind o display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"

# prefix + s で fzf ポップアップからセッション切替。ctrl-x で選択中のを kill。
bind s display-popup -E -w 40% -h 50% "~/.config/tmux/session-switcher.sh"
# 標準のツリー表示は prefix + S に退避（一覧俯瞰・セッション削除 x 等に便利）。
bind S choose-tree -Zs

# --- コピーモード（vi 操作 + macOS クリップボード連携）----------------------
# mode-keys はオプションだが、下の bind 群と一体の機能なのでここに置く。
setw -g mode-keys vi
# v で選択開始、y で選択を pbcopy に流す（コピー後もコピーモードに留まる）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe "pbcopy"
# マウスでドラッグ選択した場合も、離した時点で pbcopy に入れる
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# edit-mode でもマウスホイールでスクロールできるように
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down
