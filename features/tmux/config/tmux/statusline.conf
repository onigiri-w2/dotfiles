# ---- ミニマル・ステータスライン（Tokyo Night・青基調）----
set -g status on
set -g status-interval 5
set -g status-justify centre

# 色（背景なし・非アクティブは沈ませる）
set -g status-style "bg=default,fg=#565f89"

# 左：セッション名（prefix 中はアイコンごとオレンジ）
set -g status-left " #{?client_prefix,#[fg=#bb9af7],#[fg=#7aa2f7]} #S "
set -g status-left-length 100

# 右：git ブランチ（アクティブペインのディレクトリに追従）
set -g status-right " #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's|^|#[fg=#7dcfff] #[fg=#a9b1d6]|') "

# ウィンドウ一覧（番号は 7 セグメント風デジタル数字）
set -g window-status-format " #{s/0/🯰/;s/1/🯱/;s/2/🯲/;s/3/🯳/;s/4/🯴/;s/5/🯵/;s/6/🯶/;s/7/🯷/;s/8/🯸/;s/9/🯹/:window_index} #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #{s/0/🯰/;s/1/🯱/;s/2/🯲/;s/3/🯳/;s/4/🯴/;s/5/🯵/;s/6/🯶/;s/7/🯷/;s/8/🯸/;s/9/🯹/:window_index} #W #[default]"

# ペインの枠
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# 通知の点滅など、気を散らすものは消す
set -g visual-activity off
set -g visual-bell off
set -g monitor-activity off
