
# -------------------- #
# フォント
# -------------------- #
font_size 15
font_family="Monaco"
bold_font        auto
italic_font      auto
bold_italic_font auto


# -------------------- #
# 透過
# -------------------- #
background_opacity 0.85


# ターミナルのヘッダーを隠す
# ウィンドウの装飾を無効化しつつ、特定の要素のみを残す
hide_window_decorations titlebar-only

# ウィンドウの角を丸くする
# window_border_width 0
# window_margin_width 10 0
# placement_strategy center
# background_opacity 0.9

# タイトルバーの背景を透明に
# active_tab_background   none
# inactive_tab_background none

# タイトルテキストを非表示に
# macos_show_window_title_in none  # macOSの場合





# BEGIN_KITTY_THEME
# Monokai
include current-theme.conf
# END_KITTY_THEME
#
#
#
