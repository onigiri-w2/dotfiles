
# -------------------- #
# フォント
# -------------------- #
font_size 18
font_family="Monaco"
bold_font        auto
italic_font      auto
bold_italic_font auto

# ターミナルのヘッダーを隠す
# ウィンドウの装飾を無効化しつつ、特定の要素のみを残す
hide_window_decorations titlebar-only

placement_strategy center


# 背景の不透明度の操作を有効化
background_opacity 1
dynamic_background_opacity yes
map cmd+shift+0 set_background_opacity 1
map cmd+shift+9 set_background_opacity 0.9
map cmd+shift+7 set_background_opacity 0.7


# ctrl + c の改善
# map ctrl+c send_text all \x03
input_delay 1

repaint_delay 10
input_delay 3



# BEGIN_KITTY_THEME
# Tokyo Night Storm
include current-theme.conf
# END_KITTY_THEME
